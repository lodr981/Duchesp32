name: Build firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Vytvořit Release (tag v<FW_VERSION>) z tohoto commitu"
        type: boolean
        default: false

permissions:
  contents: write

env:
  ESP32_CORE: "3.3.0"
  TFT_ESPI: "2.5.43"
  FQBN: "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=custom,CDCOnBoot=cdc,PSRAM=enabled"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ghost renderer builds and runs on the desktop
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -ISoulCage tools/preview/preview.cpp \
            SoulCage/gfx.cpp SoulCage/ghost.cpp SoulCage/pet.cpp -o preview
          mkdir -p preview-frames && ./preview preview-frames 0 3 1 0 31

      - name: Version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/#define FW_VERSION "\(.*\)"/\1/p' SoulCage/config.h)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "config.h has $version, tag is ${GITHUB_REF_NAME}"; exit 1; }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.ESP32_CORE }}-${{ env.TFT_ESPI }}

      - uses: arduino/setup-arduino-cli@v2

      - name: Install core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE}
          arduino-cli lib install "TFT_eSPI@${TFT_ESPI}"
          # TFT_eSPI is configured by editing the library: use the Waveshare setup.
          cp TFT_eSPI_Setup/Setup303_Waveshare_esp32s3_round_no_touch.h ~/Arduino/libraries/TFT_eSPI/User_Setup.h

      - name: Compile
        run: arduino-cli compile --fqbn "$FQBN" --warnings default --output-dir build SoulCage

      - name: Package
        id: package
        run: |
          mkdir -p dist
          cp build/SoulCage.ino.bin dist/soulcage.bin
          cp build/SoulCage.ino.merged.bin dist/soulcage-full.bin
          version=$(sed -n 's/#define FW_VERSION "\(.*\)"/\1/p' SoulCage/config.h)
          md5=$(md5sum dist/soulcage.bin | cut -d' ' -f1)
          notes=$(git log -1 --format=%s | sed 's/\\/\\\\/g; s/"/\\"/g')
          cat > dist/manifest.json <<EOF
          {
            "version": "$version",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$version/soulcage.bin",
            "md5": "$md5",
            "notes": "$notes"
          }
          EOF
          cat dist/manifest.json
          ls -la dist
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: soulcage-firmware
          path: dist/

      # Release from a pushed tag, or from a manual run with "release" ticked (creates the tag).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/soulcage.bin
            dist/soulcage-full.bin
            dist/manifest.json
          generate_release_notes: true
